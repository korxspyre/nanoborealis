# NanoBorealis: plugged in, closing the lid doesn't put the computer to sleep, so its agent stays
# reachable. This covers the login screen; once someone signs in, KDE's power settings apply
# (the same by default, see /etc/xdg/powerdevilrc). On battery, closing the lid still suspends.
[Login]
HandleLidSwitchExternalPower=ignore
