# Realtek Wi-Fi on the rtw89 driver (RTL8852AE/BE/BTE/CE, RTL8851BE, RTL8922AE). On many laptops
# the chip comes back from sleep with its crystal not ready ("xtal si not ready", "mac preinit
# fail, ret: -110"), and neither restarting networking, reloading the driver nor resetting the
# chip revives it: only a restart does. Keeping its PCIe link and radio out of their deepest
# power-saving states avoids that, for a little more power while idle.
options rtw89_pci disable_clkreq=y disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_ps_mode=y
