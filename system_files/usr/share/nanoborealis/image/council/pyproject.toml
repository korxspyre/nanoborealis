[project]
name = "nanoborealis-council"
version = "0.1.0"
description = "The council's tools for a nanobot seat: the colony's floor, task board and votes"
requires-python = ">=3.10"
dependencies = []  # nanobot itself is what loads these; the tools use only the standard library

[project.entry-points."nanobot.tools"]
colony_read = "nanoborealis_council.tools:ColonyRead"
colony_post = "nanoborealis_council.tools:ColonyPost"
task_list = "nanoborealis_council.tools:TaskList"
task_claim = "nanoborealis_council.tools:TaskClaim"
task_update = "nanoborealis_council.tools:TaskUpdate"
task_submit = "nanoborealis_council.tools:TaskSubmit"
task_review = "nanoborealis_council.tools:TaskReview"
vote = "nanoborealis_council.tools:Vote"
escalate = "nanoborealis_council.tools:Escalate"
rig_ps = "nanoborealis_council.tools:RigPs"
rig_send = "nanoborealis_council.tools:RigSend"
rig_inbox = "nanoborealis_council.tools:RigInbox"
hands_devices = "nanoborealis_council.hands:HandsDevices"
hands_run = "nanoborealis_council.hands:HandsRun"
hands_open = "nanoborealis_council.hands:HandsOpen"
crew_task = "nanoborealis_council.crew:CrewTask"
crew_check = "nanoborealis_council.crew:CrewCheck"
crew_members = "nanoborealis_council.crew:CrewMembers"
crew_send = "nanoborealis_council.crew:CrewSend"
crew_inbox = "nanoborealis_council.crew:CrewInbox"
todo = "nanoborealis_council.todo:TodoWrite"
tools_load = "nanoborealis_council.lean:ToolsLoad"
setup_read = "nanoborealis_council.setup:SetupRead"
setup_change = "nanoborealis_council.setup:SetupChange"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nanoborealis_council"]
