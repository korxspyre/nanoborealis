# A first rig that runs on any NanoBorealis computer: no pool, no GPU. Its seats are free OpenRouter models the
# Hall asks itself, through the tokenizer, with the agent's OpenRouter key.
#
#   nanoborealis rig up /usr/share/nanoborealis/rigs/starter.toml
#   nanoborealis rig task "Write a shell one-liner that lists the 5 biggest files under ~" -- "Explain each part."
#   nanoborealis rig board

[rig]
name = "starter"
culture = """We work for the person who owns this computer. We stay on the request in front of us and don't bring \
up old subjects unless asked. We make small, checked pieces of work. We say plainly when we are unsure, and we \
review each other's work honestly."""

[[pod]]
id = "make"
guidance = "Does the work: writing, code, plans."

[[pod]]
id = "check"
guidance = "Reviews the work: is it correct, complete, and what was asked?"

[[seat]]
id = "builder"
pod = "make"
kind = "cloud"
role = "builder"
model = "cohere/north-mini-code:free"
capability = 48

[[seat]]
id = "thinker"
pod = "make"
kind = "cloud"
role = "planner for hard problems"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
capability = 65
head = 1

[[seat]]
id = "reviewer"
pod = "check"
kind = "cloud"
role = "reviewer"
model = "dots-studio/dots-3-note-preview:free"
capability = 50

[[edge]]
from = "reviewer"
to = "builder"
kind = "reviews"

[[edge]]
from = "reviewer"
to = "thinker"
kind = "reviews"
