---
name: Build container image
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  # Every push to main, and the nightly rebuild, publishes :dev. A release tag (vX.Y.Z) runs this
  # through the Release workflow, which publishes the build as :stable and :X.Y.Z.
  push:
    branches: [main]
    # Only changes that can alter the OS image rebuild it (a push cancels a build in progress).
    paths-ignore:
      - '**/README.md'
      # The app's source (client/src) ships in the image; its tools and packaging don't.
      - 'client/dev/**'
      - 'client/packaging/**'
      - 'client/pyproject.toml'
      - 'client/run.sh'
      - 'client/run-windows.cmd'
      - '.github/workflows/client-release.yml'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/spike-*.yml'
      - '.github/workflows/branding-inventory.yml'
      - '.github/workflows/build-disk.yml'
      - 'tests/branding-inventory.sh'
      - 'pool/**'
      - '.github/workflows/pool.yml'
      - '.gitignore'
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: "Tag the build is published as (dev or stable)"
        type: string
        default: dev
      version:
        description: "The release's version (X.Y.Z), published as a tag too"
        type: string
        default: ""

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.image }})
    runs-on: ubuntu-26.04
    # Two editions of every build: Aurora, and Aurora with NVIDIA's open driver and container
    # toolkit, which computers with an NVIDIA GPU switch to (nanoborealis update --nvidia).
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nanoborealis
            base: ghcr.io/ublue-os/aurora:stable
          - image: nanoborealis-nvidia
            base: ghcr.io/ublue-os/aurora-nvidia-open:stable

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          echo "IMAGE_NAME=${{ matrix.image }}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          # Builds are dev builds; a release tag's build (through the Release workflow) is stable.
          echo "DEFAULT_TAG=${{ inputs.channel || 'dev' }}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          if [ -n "${{ inputs.version }}" ]; then
            alias_tags="${alias_tags} ${{ inputs.version }}"
          fi

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # A build that breaks our layer (upstream renamed or dropped something we rely on) never
      # reaches even the dev channel.
      - name: Check the image before publishing
        run: |
          podman run --rm --entrypoint /usr/bin/bash -v "$PWD/tests:/tests:ro" \
            "${IMAGE_NAME}:${DEFAULT_TAG}" /tests/image-checks.sh

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Keyless signing: the signature is tied to this repository's workflow through GitHub's OIDC
      # token and recorded in Sigstore's public log, so there's no key to keep. See the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

