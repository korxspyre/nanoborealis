---
name: Pool node image

# Builds the NanoBorealis pool node (a pinned exo), proves it on a runner (serves a model, answers,
# makes tool calls, and splits one model across two nodes), and only then publishes it. The NVIDIA
# (CUDA 13) node is built and checked alongside; a GPU proves it on real hardware. A real
# nanobot agent turn through the pool runs afterwards and is reported.
on:
  push:
    branches: [main]  # published by exo version, not by channel
    paths:
      - 'pool/**'
      - '.github/workflows/pool.yml'
      - 'system_files/usr/share/nanoborealis/pool.py'
      - 'system_files/usr/share/nanoborealis/loadout.py'
      - 'system_files/usr/share/nanoborealis/benchdb.py'
      - 'system_files/usr/share/nanoborealis/scores.py'
      - 'system_files/usr/libexec/nanoborealis-relay'
  workflow_dispatch:
    inputs:
      exo_repo:
        description: "exo source repository"
        required: false
        default: "https://github.com/exo-explore/exo"
      exo_ref:
        description: "Engine commit or tag"
        required: false
        default: "21a54c5"
      jobs:
        description: "Which jobs (all, or some of: loadout bundles cuda13 cpu)"
        required: false
        default: "all"

jobs:
  loadout:
    name: Loadout planner and pool commands
    if: inputs.jobs == '' || inputs.jobs == 'all' || contains(inputs.jobs, 'loadout')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The planner, and every `pool` loadout command against a stand-in exo pool with a GPU desktop,
      # a Mac and two CPU laptops: nodes, plan, apply, bench, drain, undrain, policy, scores.
      - name: Loadout checks
        run: python3 pool/tests/loadout_check.py

      # A computer that coordinates the pool without a node takes exo's version from the OS; the nodes
      # the app runs are built from EXO_REF. They must be the same exo, or the nodes won't pool.
      - name: The OS and the node images pin the same exo
        run: |
          commit="$(cat system_files/usr/share/nanoborealis/pool/exo-commit)"
          ref="$(sed -n 's/^ARG EXO_REF=//p' pool/Containerfile)"
          [[ "$commit" == "$ref"* ]] || { echo "::error::exo-commit ($commit) isn't EXO_REF ($ref)"; exit 1; }
          grep -q "inputs.exo_ref || '$ref'" .github/workflows/pool.yml || { echo "::error::pool.yml's default exo isn't $ref"; exit 1; }
          echo "exo $commit everywhere"

      - name: The council's Hall
        run: python3 tests/hall_check.py

      - name: The council's seats
        run: python3 tests/council_seats_check.py

      - name: The council's orchestrator
        run: python3 tests/orchestrator_check.py

  bundles:
    # The node the NanoBorealis app runs on a Mac (client/src/poolnode.py; on Linux it runs the node
    # image under Podman): exo at the pool's exact version, packed with exo's own PyInstaller spec,
    # proven to start and answer, and published from main as release pool-node-<exo ref> with its
    # SHA-256.
    name: Node bundle (${{ matrix.platform }})
    if: inputs.jobs == '' || inputs.jobs == 'all' || contains(inputs.jobs, 'bundles')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      EXO: http://127.0.0.1:52415
      MODEL: mlx-community/Qwen3-0.6B-8bit
      EXO_REPO: ${{ inputs.exo_repo || 'https://github.com/exo-explore/exo' }}
      EXO_REF: ${{ inputs.exo_ref || '21a54c5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchains
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          node --version

      - name: exo at the pool's version, and its dashboard
        run: |
          git clone --filter=blob:none "$EXO_REPO" "$RUNNER_TEMP/exo"
          git -C "$RUNNER_TEMP/exo" checkout "$EXO_REF"
          cd "$RUNNER_TEMP/exo/dashboard" && npm install --no-audit --no-fund --loglevel=error && npm run build

      - name: Build the bundle
        working-directory: ${{ runner.temp }}/exo
        run: |
          # exo's spec bundles its pinned fork of macmon, for the Mac's power and GPU readings, and
          # MLX with Metal, which exo installs as its mlx extra (as its own `just sync` does).
          cargo install --git https://github.com/vladkens/macmon --rev a1cd06b6cc0d5e61db24fd8832e74cd992097a7d macmon --force
          uv sync --all-packages --extra mlx
          uv run pyinstaller packaging/pyinstaller/exo.spec
          mkdir -p "$RUNNER_TEMP/out"
          cp -R dist/exo "$RUNNER_TEMP/out/exo-node"
          git log -1 --format='%H' > "$RUNNER_TEMP/out/exo-node/ENGINE_COMMIT"
          cd "$RUNNER_TEMP/out"
          tar -czf "exo-node-${{ matrix.platform }}.tar.gz" exo-node
          shasum -a 256 "exo-node-${{ matrix.platform }}.tar.gz" | tee "exo-node-${{ matrix.platform }}.tar.gz.sha256"
          ls -la

      - name: The bundled node starts and serves
        run: |
          "$RUNNER_TEMP/out/exo-node/exo" > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf "$EXO/node_id" -o /dev/null && break; sleep 2; done
          curl -sf "$EXO/node_id"
          echo
          curl -s -X POST "$EXO/place_instance" -H 'Content-Type: application/json' -d "{\"model_id\": \"$MODEL\"}"
          echo
          for i in $(seq 1 60); do
            curl -s -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' -o chat.json \
              -d "{\"model\": \"$MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Say hello.\"}], \"max_tokens\": 24}" || true
            python3 -c 'import json; assert json.load(open("chat.json"))["choices"]' 2>/dev/null && break
            sleep 15
          done
          python3 -c 'import json; r = json.load(open("chat.json")); print("reply:", r["choices"][0]["message"].get("content"))'

      # Handed to the release job, which publishes everything at once: releases here are immutable,
      # so nothing can be added to one after it's published.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pool-release-bundle-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/out/exo-node-*.tar.gz
            ${{ runner.temp }}/out/exo-node-*.sha256
          retention-days: 2

      # What the node did, without exo's repeated notes about gated models it wasn't asked for.
      - name: Logs
        if: always()
        run: |
          curl -s "$EXO/state" | python3 -c 'import json, sys; s = json.load(sys.stdin); print("runners:", json.dumps(s.get("runners")))' || true
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/node.log" 2>/dev/null | grep -v -e '^\s*$' -e '^  File ' \
            | grep -v -i -e 'HuggingFaceAuthentication' -e 'fetching file list from HF' -e '^Traceback' | tail -n 120 || true

  cuda13:
    name: Build, check and publish (NVIDIA, CUDA 13)
    if: inputs.jobs == '' || inputs.jobs == 'all' || contains(inputs.jobs, 'cuda13')
    # GitHub's runners have no GPU: this proves the image builds, holds the CUDA build of MLX, and
    # starts a node (which falls back to the processor without a GPU). Serving on a GPU is proven on
    # real hardware with `nanoborealis pool bench`.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    env:
      EXO: http://127.0.0.1:52415
      EXO_REPO: ${{ inputs.exo_repo || 'https://github.com/exo-explore/exo' }}
      EXO_REF: ${{ inputs.exo_ref || '21a54c5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build the node image
        run: |
          df -h / | tail -1
          cp LICENSE NOTICE pool/  # the image carries them (pool/Containerfile)
          podman build --build-arg VARIANT=cuda13 --build-arg "EXO_REPO=$EXO_REPO" --build-arg "EXO_REF=$EXO_REF" \
            -t nanoborealis-pool:cuda13 pool/
          podman image ls nanoborealis-pool:cuda13
          df -h / | tail -1

      - name: The CUDA build is inside
        run: |
          podman run --rm --entrypoint /opt/exo/.venv/bin/python nanoborealis-pool:cuda13 -c '
          import importlib.metadata as m
          import pynvml
          print("mlx-cuda-13", m.version("mlx-cuda-13"), "| nvidia-ml-py", m.version("nvidia-ml-py"))'
          test "$(podman image inspect --format '{{index .Labels "org.nanoborealis.pool.variant"}}' nanoborealis-pool:cuda13)" = cuda13

      - name: A node starts without a GPU
        run: |
          podman run -d --name node -p 127.0.0.1:52415:52415 nanoborealis-pool:cuda13
          for i in $(seq 1 120); do curl -sf "$EXO/node_id" -o /dev/null && break; sleep 2; done
          curl -sf "$EXO/state" -o state.json
          python3 - <<'PY'
          import json
          backends = sorted({b for bs in json.load(open("state.json")).get("nodeBackends", {}).values() for b in bs})
          print("backends:", backends)
          assert "MlxCpu" in backends and "MlxCuda" not in backends, "without a GPU the node must report the processor only"
          PY

      # What the NanoBorealis app imports into WSL on Windows (client/src/poolnode.py), checked whole.
      - name: The node as a WSL system
        run: |
          pool/wsl-export.sh cuda13 nanoborealis-pool:cuda13 "$RUNNER_TEMP/wsl"
          ls -la "$RUNNER_TEMP/wsl"
          python3 - "$RUNNER_TEMP/wsl" cuda13 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out, variant = pathlib.Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads((out / f"wsl-{variant}.json").read_text())
          whole = hashlib.sha256()
          for part in manifest["parts"]:
              data = (out / part["name"]).read_bytes()
              assert hashlib.sha256(data).hexdigest() == part["sha256"], part["name"]
              assert len(data) < 2 * 1024**3, "a part is over GitHub's release-file limit"
              whole.update(data)
          assert whole.hexdigest() == manifest["sha256"], "the parts don't make up the whole"
          listing = subprocess.run(f"cat {out}/wsl-{variant}.tar.gz.part* | tar -tz", shell=True, check=True,
                                   capture_output=True, text=True).stdout.split()
          for needed in ("etc/wsl.conf", "etc/nanoborealis-variant", "opt/exo/.venv/bin/exo", "opt/exo/ENGINE_COMMIT"):
              assert needed in listing or "./" + needed in listing, f"missing {needed}"
          print("the WSL system is whole, and holds exo, its version and its wsl.conf")
          PY

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in cuda13 "cuda13-$(date -u +%Y%m%d)" "cuda13-${EXO_REF}"; do
            podman push nanoborealis-pool:cuda13 "ghcr.io/$owner/nanoborealis-pool:$tag"
          done

      # The same node as a WSL system, for the app on Windows: to the release job.
      - name: Hand the WSL system to the release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pool-release-wsl-cuda13
          path: ${{ runner.temp }}/wsl/wsl-cuda13.*
          retention-days: 2

      - name: Logs
        if: always()
        run: podman logs node 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -n 60 || true

  cpu:
    name: Build, prove and publish (CPU)
    if: inputs.jobs == '' || inputs.jobs == 'all' || contains(inputs.jobs, 'cpu')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    env:
      EXO: http://127.0.0.1:52415
      MODEL: mlx-community/Qwen3-0.6B-8bit
      EXO_REPO: ${{ inputs.exo_repo || 'https://github.com/exo-explore/exo' }}
      EXO_REF: ${{ inputs.exo_ref || '21a54c5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build the node image
        run: |
          cp LICENSE NOTICE pool/  # the image carries them (pool/Containerfile)
          podman build --build-arg VARIANT=cpu --build-arg "EXO_REPO=$EXO_REPO" --build-arg "EXO_REF=$EXO_REF" \
            -t nanoborealis-pool:cpu pool/
          podman run --rm --entrypoint cat nanoborealis-pool:cpu /opt/exo/ENGINE_REPO /opt/exo/ENGINE_COMMIT

      # What the NanoBorealis app imports into WSL on Windows (client/src/poolnode.py), checked whole.
      - name: The node as a WSL system
        run: |
          pool/wsl-export.sh cpu nanoborealis-pool:cpu "$RUNNER_TEMP/wsl"
          ls -la "$RUNNER_TEMP/wsl"
          python3 - "$RUNNER_TEMP/wsl" cpu <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out, variant = pathlib.Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads((out / f"wsl-{variant}.json").read_text())
          whole = hashlib.sha256()
          for part in manifest["parts"]:
              data = (out / part["name"]).read_bytes()
              assert hashlib.sha256(data).hexdigest() == part["sha256"], part["name"]
              assert len(data) < 2 * 1024**3, "a part is over GitHub's release-file limit"
              whole.update(data)
          assert whole.hexdigest() == manifest["sha256"], "the parts don't make up the whole"
          listing = subprocess.run(f"cat {out}/wsl-{variant}.tar.gz.part* | tar -tz", shell=True, check=True,
                                   capture_output=True, text=True).stdout.split()
          for needed in ("etc/wsl.conf", "etc/nanoborealis-variant", "opt/exo/.venv/bin/exo", "opt/exo/ENGINE_COMMIT"):
              assert needed in listing or "./" + needed in listing, f"missing {needed}"
          print("the WSL system is whole, and holds exo, its version and its wsl.conf")
          PY

      - name: Start a node
        run: |
          podman run -d --name node -p 127.0.0.1:52415:52415 nanoborealis-pool:cpu
          for i in $(seq 1 120); do curl -sf "$EXO/v1/models" -o /dev/null && break; sleep 2; done
          curl -sf "$EXO/v1/models" -o /dev/null

      - name: Serve a small model
        run: |
          curl -s -X POST "$EXO/place_instance" -H 'Content-Type: application/json' \
            -d "{\"model_id\": \"$MODEL\"}" -w '\nHTTP %{http_code}\n'
          for i in $(seq 1 90); do
            curl -sf "$EXO/v1/models?status=downloaded" \
              | python3 -c 'import json, os, sys; sys.exit(0 if os.environ["MODEL"] in [m["id"] for m in json.load(sys.stdin)["data"]] else 1)' \
              && break
            sleep 10
          done
          for i in $(seq 1 40); do
            curl -s -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' -o chat.json \
              -d "{\"model\": \"$MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Say hello.\"}], \"max_tokens\": 48}" || true
            python3 -c 'import json; assert json.load(open("chat.json"))["choices"]' 2>/dev/null && break
            sleep 15
          done
          python3 -c 'import json; r = json.load(open("chat.json")); print("reply:", r["choices"][0]["message"].get("content"))'

      - name: Tool calls work
        run: |
          curl -s -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' -o tool.json -d "{
            \"model\": \"$MODEL\", \"max_tokens\": 512,
            \"messages\": [{\"role\": \"user\", \"content\": \"What is the weather in Paris? Use the tool.\"}],
            \"tools\": [{\"type\": \"function\", \"function\": {\"name\": \"get_weather\",
              \"parameters\": {\"type\": \"object\", \"properties\": {\"city\": {\"type\": \"string\"}}, \"required\": [\"city\"]}}}]}"
          python3 - <<'EOF'
          import json
          message = json.load(open("tool.json"))["choices"][0]["message"]
          calls = message.get("tool_calls") or []
          print("tool calls:", json.dumps(calls))
          assert calls and calls[0]["function"]["name"] == "get_weather", "no tool call came back"
          EOF

      - name: Two machines pool one model
        run: |
          # Two nodes on their own network, like two computers on a home LAN. Only node A's API is
          # reachable from the runner; the model must still be split across both of them.
          podman rm -f node
          podman network create poolnet
          podman run -d --name node-a --network poolnet -p 127.0.0.1:52415:52415 nanoborealis-pool:cpu
          podman run -d --name node-b --network poolnet nanoborealis-pool:cpu
          python3 pool/tests/pooled.py "$EXO" "$MODEL"

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in cpu "cpu-$(date -u +%Y%m%d)" "cpu-${EXO_REF}"; do
            podman push nanoborealis-pool:cpu "ghcr.io/$owner/nanoborealis-pool:$tag"
          done

      - name: Hand the WSL system to the release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pool-release-wsl-cpu
          path: ${{ runner.temp }}/wsl/wsl-cpu.*
          retention-days: 2

      # What `nanoborealis pool` runs on a computer, against the live two-node pool.
      - name: The OS's pool tools on the live pool
        env:
          TOKEN: ci-relay-token-0123456789
        run: |
          tools=system_files/usr/share/nanoborealis
          timeout 1800 python3 $tools/pool.py serve "$MODEL"
          python3 $tools/pool.py status | tee status.txt
          grep -q "Computers in the pool: 2" status.txt
          grep -qF "$MODEL" status.txt
          # The relay the agent goes through: chat only, and only with its token.
          NANOBOREALIS_RELAY_TOKEN="$TOKEN" NANOBOREALIS_RELAY_LISTEN=127.0.0.1:11436 \
            nohup python3 system_files/usr/libexec/nanoborealis-relay > "$RUNNER_TEMP/relay.log" 2>&1 &
          sleep 1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:11436/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
                  -d '{}' http://127.0.0.1:11436/place_instance)" = 403
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:11436/v1/models -o /dev/null
          echo "relay: refuses strangers and everything but chat"

      # The loadout on the live pool: the planner keeps the model served above and adds a second,
      # each placed on the computers it chose, so the pool serves two models at once.
      - name: Two models at once, placed by the planner
        env:
          NANOBOREALIS_POOL_STATE: ${{ runner.temp }}/poolstate
        run: |
          tools=system_files/usr/share/nanoborealis
          # As light as the first: on a CPU runner a 1B model needs over half an hour just to warm up.
          second=mlx-community/Qwen3-0.6B-4bit
          # A CPU runner is far below an agent's speed floors; this proves placement, not speed.
          python3 $tools/pool.py policy min_gen_tps=0 min_prompt_tps=0 max_models=2 headroom_gb=0.5 \
            kv_reserve_gb=0.25 "pinned=$MODEL,$second"
          python3 $tools/pool.py nodes
          python3 $tools/pool.py plan
          timeout 1800 python3 $tools/pool.py apply --yes
          python3 $tools/pool.py status | tee status2.txt
          grep -qF "$MODEL" status2.txt
          grep -qF "$second" status2.txt
          grep -q "Models served: 2" status2.txt
          # A short prompt: reading 14 tokens takes a CPU runner minutes, and the job has three hours.
          timeout 1800 python3 $tools/pool.py bench --prompt 64
          python3 $tools/pool.py bench --results | tee results.txt
          grep -qF "$second" results.txt

      # By now the model is split across both nodes, so this is the agent on a two-machine pool,
      # reached through the relay as on a NanoBorealis computer.
      # A CPU runner needs most of an hour to read the agent's long prompt, so the turn is
      # reported but doesn't hold back the image; the tool-call check above gates it.
      - name: A real agent turn through the pool
        continue-on-error: true
        timeout-minutes: 55
        run: |
          version="$(sed -n 's/^ARG NANOBOT_VERSION=//p' system_files/usr/share/nanoborealis/image/Containerfile)"
          python3 -m venv "$RUNNER_TEMP/nb"
          "$RUNNER_TEMP/nb/bin/pip" install --quiet "nanobot-ai==$version" "websockets>=13"
          mkdir -p "$RUNNER_TEMP/gw"
          python3 - "$RUNNER_TEMP/gw/config.json" <<'EOF'
          import json, os, sys
          json.dump({
              "providers": {"device-pool": {"apiBase": "http://127.0.0.1:11436/v1", "apiKey": "ci-relay-token-0123456789"}},
              "modelPresets": {"device-pool": {"provider": "device-pool", "model": os.environ["MODEL"], "maxTokens": 1024,
                                               "contextWindowTokens": 32768, "temperature": 0.2}},
              "agents": {"defaults": {"modelPreset": "device-pool"}},
              "gateway": {"port": 18791},
              "channels": {"websocket": {"enabled": True, "host": "127.0.0.1", "port": 18765,
                                         "tokenIssueSecret": "test-password", "websocketRequiresToken": True}},
          }, open(sys.argv[1], "w"), indent=2)
          EOF
          # A CPU runner reads the agent's long prompt slower than nanobot's default 90 s patience.
          NANOBOT_STREAM_IDLE_TIMEOUT_S=1800 nohup "$RUNNER_TEMP/nb/bin/nanobot" gateway --foreground \
            --config "$RUNNER_TEMP/gw/config.json" > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:18791/health >/dev/null && break; sleep 1; done
          "$RUNNER_TEMP/nb/bin/python" client/dev/agent_check.py http://127.0.0.1:18765 test-password 3600

      - name: Logs
        if: always()
        run: |
          curl -s "$EXO/state" | python3 -c 'import json, sys; s = json.load(sys.stdin); print("runners:", json.dumps(s.get("runners")))' || true
          # exo keeps retrying gated catalog models without a Hugging Face token; that noise would
          # push everything useful out of the tail.
          for c in $(podman ps -a --format '{{.Names}}'); do
            echo "--- $c"; podman logs "$c" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -v -e '^[[:space:]│└]' -e '^\s*$' \
              | grep -v -i -e 'HuggingFaceAuthentication' -e 'fetching file list from HF' -e '^Traceback' \
                          -e '^> File .*download_utils' | tail -n 150 || true
          done
          echo "--- gateway"; tail -n 40 "$RUNNER_TEMP/gateway.log" 2>/dev/null || true

  # One release per run, published in one go with everything the other jobs handed over: the
  # repository's releases are immutable, so a release can't be added to after it's published.
  # Its name carries the run number; nanoborealis-remote finds the newest one for its exo version.
  # The release's tag, made first, while main is still the commit this run builds. GitHub refuses a
  # workflow's token a release whose target is a commit with different workflow files from main's
  # newest (that takes the "workflows" permission, which the token never has), and a run lasts hours.
  # Onto a tag that already exists, with no target named, the release keeps the tag's commit.
  tag:
    name: Tag the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      EXO_REF: ${{ inputs.exo_ref || '21a54c5' }}
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/pool-node-${EXO_REF:0:7}-r${GITHUB_RUN_NUMBER}" \
            -f sha="$GITHUB_SHA" >/dev/null

  release:
    name: Publish the node bundles
    needs: [tag, bundles, cuda13, cpu]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tag.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      EXO_REF: ${{ inputs.exo_ref || '21a54c5' }}
    steps:
      - name: Get LICENSE and NOTICE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pool-release-*
          merge-multiple: true
          path: release
      - name: Publish
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ "${#files[@]}" -eq 0 ]; then echo "Nothing to publish."; exit 0; fi
          ls -la release
          tag="pool-node-${EXO_REF:0:7}-r${GITHUB_RUN_NUMBER}"
          # Never the repository's latest release: the app's download links point at that.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Pool node bundles, exo ${EXO_REF:0:7} (run ${GITHUB_RUN_NUMBER})" \
            --notes "The pool nodes the NanoBorealis app runs: on a Mac, and on Windows through WSL, at exo ${EXO_REF}. NanoBorealis's own files are under the PolyForm Noncommercial License 1.0.0 (LICENSE); exo keeps its own license, Apache-2.0 (NOTICE)." \
            "${files[@]}" LICENSE NOTICE
