---
name: Spike - exo as an agent backend

# An experiment, run by hand: can an exo cluster (pooled inference across devices) drive
# the NanoBorealis agent? Builds upstream exo on a Linux runner (CPU), serves a small model,
# then checks plain chat, tool calls, and a real nanobot turn that has to use a tool.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "exo model id (blank: the largest small Qwen3 in exo's list)"
        required: false
        default: ""
      max_mb:
        description: "size cap for the automatic pick, in MB"
        required: false
        default: "1500"

jobs:
  exo:
    name: exo ${{ matrix.variant }} on CPU, driving the agent
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The latest source ships a custom mlx build with no CPU library; swap in a matching PyPI pair.
          # (v1.0.71 is out: its runner calls new_thread_local_stream, which only exo's mlx fork has.)
          - variant: main
            ref: main
            extra: mlx-cpu
            mlx_override: "mlx==0.32.2 mlx-cpu==0.32.2"
    env:
      EXO: http://127.0.0.1:52415
      EXO_REF: ${{ matrix.ref }}
      EXO_EXTRA: ${{ matrix.extra }}
      MLX_OVERRIDE: ${{ matrix.mlx_override }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Toolchains
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustup toolchain install nightly --profile minimal
          node --version

      - name: Build exo
        run: |
          git clone --depth 1 --branch "$EXO_REF" https://github.com/exo-explore/exo "$RUNNER_TEMP/exo"
          git -C "$RUNNER_TEMP/exo" log -1 --format='exo %h (%cd)'
          cd "$RUNNER_TEMP/exo/dashboard" && npm install --no-audit --no-fund --loglevel=error && npm run build
          cd "$RUNNER_TEMP/exo" && uv sync --extra "$EXO_EXTRA"
          if [ -n "$MLX_OVERRIDE" ]; then
            # `uv run --no-sync` below keeps this override in place.
            uv pip install --python .venv/bin/python $MLX_OVERRIDE
          fi
          .venv/bin/python -c 'import mlx.core as mx; print("mlx works:", mx.__version__, mx.array([1, 2]).sum().item())'
          df -h / | tail -1

      - name: Start a node
        run: |
          cd "$RUNNER_TEMP/exo"
          nohup uv run --no-sync exo > "$RUNNER_TEMP/exo.log" 2>&1 &
          for i in $(seq 1 180); do
            curl -sf "$EXO/v1/models" -o "$RUNNER_TEMP/models.json" && break
            sleep 2
          done
          python3 - "$RUNNER_TEMP/models.json" <<'EOF'
          import json, sys
          models = json.load(open(sys.argv[1]))["data"]
          print(f"{len(models)} models known; small ones:")
          for m in sorted(models, key=lambda m: m.get("storage_size_megabytes", 0)):
              if m.get("storage_size_megabytes", 0) <= 3000:
                  print(f"  {m['id']}  {m.get('storage_size_megabytes')} MB  caps={m.get('capabilities')}")
          EOF

      - name: Place a model
        env:
          MODEL_INPUT: ${{ inputs.model }}
          MAX_MB: ${{ inputs.max_mb }}
        run: |
          model="$MODEL_INPUT"
          if [ -z "$model" ]; then
            model="$(python3 - "$RUNNER_TEMP/models.json" "$MAX_MB" <<'EOF'
          import json, sys
          cap = int(sys.argv[2])
          models = [m for m in json.load(open(sys.argv[1]))["data"] if 0 < m.get("storage_size_megabytes", 0) <= cap]
          qwen = [m for m in models if "qwen3" in m["id"].lower() and "vl" not in m["id"].lower()]
          pick = max(qwen or models, key=lambda m: m["storage_size_megabytes"])
          print(pick["id"])
          EOF
          )"
          fi
          echo "model: $model"
          echo "MODEL=$model" >> "$GITHUB_ENV"
          curl -s -X POST "$EXO/place_instance" -H 'Content-Type: application/json' \
            -d "{\"model_id\": \"$model\"}" -w '\nHTTP %{http_code}\n'
          curl -sN "$EXO/instance/await?model_id=$model&timeout_seconds=300" | head -c 600
          echo

      - name: Wait for the model to download and load
        run: |
          for i in $(seq 1 90); do
            if curl -sf "$EXO/v1/models?status=downloaded" | python3 -c 'import json,sys,os; ids=[m["id"] for m in json.load(sys.stdin)["data"]]; sys.exit(0 if os.environ["MODEL"] in ids else 1)'; then
              echo "downloaded after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          curl -s "$EXO/state" | python3 -c 'import json,sys; s=json.load(sys.stdin); print("state keys:", sorted(s)); print("runners:", json.dumps(s.get("runners"))[:1500])' || true

      - name: Plain chat
        run: |
          # exo answers 200 with an empty body while the runner is still loading, so retry until the reply parses.
          for i in $(seq 1 40); do
            curl -s -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' -o "$RUNNER_TEMP/chat.json" \
              -d "{\"model\": \"$MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Say hello in five words.\"}], \"max_tokens\": 64}" || true
            if python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["choices"]' "$RUNNER_TEMP/chat.json" 2>/dev/null; then
              echo "answered on attempt $i"
              break
            fi
            sleep 15
          done
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("reply:", r["choices"][0]["message"].get("content")); print("usage:", r.get("usage"))' "$RUNNER_TEMP/chat.json"

      - name: Tool call, non-streaming and streaming
        run: |
          body='{"model": "'"$MODEL"'", "max_tokens": 512,
                 "messages": [{"role": "user", "content": "What is the weather in Paris right now? Use the tool."}],
                 "tools": [{"type": "function", "function": {"name": "get_weather", "description": "Current weather for a city",
                   "parameters": {"type": "object", "properties": {"city": {"type": "string"}}, "required": ["city"]}}}]}'
          curl -s -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' -d "$body" -o "$RUNNER_TEMP/tool.json"
          python3 - "$RUNNER_TEMP/tool.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          message = r["choices"][0]["message"]
          print("finish_reason:", r["choices"][0].get("finish_reason"))
          print("tool_calls:", json.dumps(message.get("tool_calls")))
          print("content:", (message.get("content") or "")[:300])
          EOF
          echo "--- streaming:"
          curl -sN -X POST "$EXO/v1/chat/completions" -H 'Content-Type: application/json' \
            -d "$(echo "$body" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["stream"]=True; print(json.dumps(b))')" \
            | grep -E 'tool_calls|finish_reason' | head -8 | cut -c1-300

      - name: The agent on exo (real nanobot turn that must use a tool)
        run: |
          version="$(sed -n 's/^ARG NANOBOT_VERSION=//p' system_files/usr/share/nanoborealis/image/Containerfile)"
          python3 -m venv "$RUNNER_TEMP/nb"
          "$RUNNER_TEMP/nb/bin/pip" install --quiet "nanobot-ai==$version" "websockets>=13"
          mkdir -p "$RUNNER_TEMP/gw"
          python3 - "$RUNNER_TEMP/gw/config.json" "$MODEL" <<'EOF'
          import json, sys
          json.dump({
              "providers": {"exo": {"apiBase": "http://127.0.0.1:52415/v1", "apiKey": "none"}},
              "modelPresets": {"exo": {"provider": "exo", "model": sys.argv[2], "maxTokens": 1024,
                                       "contextWindowTokens": 32768, "temperature": 0.2}},
              "agents": {"defaults": {"modelPreset": "exo"}},
              "gateway": {"port": 18791},
              "channels": {"websocket": {"enabled": True, "host": "127.0.0.1", "port": 18765,
                                         "tokenIssueSecret": "test-password", "websocketRequiresToken": True}},
          }, open(sys.argv[1], "w"), indent=2)
          EOF
          # A CPU runner reads the agent's long prompt slower than nanobot's default 90 s stream-idle limit.
          NANOBOT_STREAM_IDLE_TIMEOUT_S=1800 nohup "$RUNNER_TEMP/nb/bin/nanobot" gateway --foreground             --config "$RUNNER_TEMP/gw/config.json" > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:18791/health >/dev/null && break; sleep 1; done
          "$RUNNER_TEMP/nb/bin/python" client/dev/agent_check.py http://127.0.0.1:18765 test-password 3600

      - name: Logs
        if: always()
        run: |
          echo "--- exo (progress and errors, tracebacks folded)"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/exo.log" | grep -v '^[[:space:]│└]' \
            | grep -iE 'download|runner|load|instance|placement|shard|error|warn|assert|memory|ready' | tail -n 80 || true
          echo "--- exo (last lines)"; sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/exo.log" | grep -v '^[[:space:]│└]' | tail -n 25 || true
          echo "--- gateway"; tail -n 60 "$RUNNER_TEMP/gateway.log" || true
