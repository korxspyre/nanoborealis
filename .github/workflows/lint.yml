---
name: Lint

# Static checks on every change, in a minute and before anything is built: pyflakes finds undefined
# names and unused imports in the Python, shellcheck finds shell mistakes (like help text that runs
# its own example as a command), and actionlint checks these workflows and the shell inside them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: pyflakes, shellcheck, actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: The tools, at fixed versions
        run: python -m pip install --quiet pyflakes==4.0.3 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25

      # Python files, and the programs without a .py name whose first line runs Python.
      - name: Python (pyflakes)
        run: |
          mapfile -t files < <(git ls-files '*.py'
            for f in $(git ls-files system_files/usr/libexec system_files/usr/bin); do
              head -n 1 "$f" | grep -q python && echo "$f"
            done)
          pyflakes "${files[@]}"

      # Shell files, and the programs without a .sh name whose first line runs a shell.
      - name: Shell (shellcheck)
        run: |
          mapfile -t files < <(git ls-files '*.sh'
            for f in $(git ls-files system_files/usr/libexec system_files/usr/bin system_files/usr/lib/systemd/system-sleep \
                       system_files/usr/share/nanoborealis/nanoborealis); do
              head -n 1 "$f" | grep -q -E 'sh$|bash' && echo "$f"
            done)
          shellcheck --severity=warning "${files[@]}"

      # The shell inside the workflows too. SC2034: `for i in $(seq ...)` loops only count tries.
      # SC2024: services started with sudo log to the runner's own files, on purpose.
      - name: Workflows (actionlint)
        env:
          SHELLCHECK_OPTS: --severity=warning --exclude=SC2034,SC2024
        run: actionlint
