---
name: Test client

# Runs the client's protocol checks against a real nanobot gateway, at the version the
# agent image pins, with a stand-in model, so a protocol change breaks here first.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'system_files/usr/share/nanoborealis/image/Containerfile'
      - 'system_files/usr/libexec/nanoborealis-remote'
      - '.github/workflows/test-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'system_files/usr/libexec/nanoborealis-remote'
  workflow_dispatch:

jobs:
  android:
    # The app as an Android APK builds, and asks for what it needs to find computers on the Wi-Fi.
    name: The app builds for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the APK
        run: client/packaging/build-android.sh 0.0.0-dev.0 1 "$RUNNER_TEMP/apk"
      - name: The APK is whole
        run: |
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$RUNNER_TEMP"/apk/*.apk | tee badging.txt | head -n 5
          grep -q "^package: name=" badging.txt
          grep -q "uses-permission: name='android.permission.CHANGE_WIFI_MULTICAST_STATE'" badging.txt

  protocol:
    name: Client against a real nanobot gateway
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nanobot at the image's version, and the client's dependencies
        run: |
          version="$(sed -n 's/^ARG NANOBOT_VERSION=//p' system_files/usr/share/nanoborealis/image/Containerfile)"
          echo "nanobot $version"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "nanobot-ai==$version" "websockets>=14" "flet==1.0.1" "zeroconf>=0.130"

      - name: Start the stand-in model and a gateway
        working-directory: client
        run: |
          nohup "$RUNNER_TEMP/venv/bin/python" dev/stub_llm.py 18080 > "$RUNNER_TEMP/stub.log" 2>&1 &
          nohup "$RUNNER_TEMP/venv/bin/nanobot" gateway --foreground --config dev/gateway-config.json > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18791/health >/dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:18791/health

      # The OS's remote-access service in front of the gateway, as on a NanoBorealis computer; in
      # test mode it writes each PIN to a file instead of the screen.
      - name: Start the remote-access service
        run: |
          mkdir -p "$RUNNER_TEMP/remote"
          NANOBOREALIS_REMOTE_PORT=18866 NANOBOREALIS_REMOTE_UPSTREAM_PORT=18765 \
          NANOBOREALIS_REMOTE_STATE="$RUNNER_TEMP/remote" NANOBOREALIS_REMOTE_TEST_SECRET=test-password \
          NANOBOREALIS_REMOTE_TEST_PIN_FILE="$RUNNER_TEMP/pin" \
            nohup python3 system_files/usr/libexec/nanoborealis-remote > "$RUNNER_TEMP/remote.log" 2>&1 &
          for i in $(seq 1 30); do grep -q 'paired devices on port' "$RUNNER_TEMP/remote.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/remote.log"

      - name: Pairing, and what it turns away
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/pairing_check.py 127.0.0.1:18866 "$RUNNER_TEMP/pin" "$RUNNER_TEMP/paired.json"'

      - name: Protocol checks, as a paired device over TLS
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/smoke.py "$RUNNER_TEMP/paired.json"'

      # A stand-in home network: the service answers at 10.254.254.1 (and .5), and where the
      # computer used to be (10.254.254.2) refuses, as after the router hands it a new address.
      - name: A paired computer with a new address is found again, and a sweep finds computers
        run: |
          sudo ip link add nbhome type dummy
          sudo ip addr add 10.254.254.1/24 dev nbhome
          sudo ip addr add 10.254.254.5/24 dev nbhome
          sudo ip link set nbhome up
          sudo iptables -I OUTPUT -d 10.254.254.2 -p tcp --dport 18866 -j REJECT --reject-with tcp-reset
          "$RUNNER_TEMP/venv/bin/python" client/dev/locate_check.py "$RUNNER_TEMP/paired.json" 10.254.254.2 10.254.254.1

      # A terminal runs as the person who approved the device, through runuser, so this instance
      # runs as root, with the runner's account standing in for the person at the screen. It also
      # serves the local socket where the app on the computer itself pairs without a PIN.
      - name: Terminal and commands, as a paired device, and the app on the computer itself
        run: |
          mkdir -p "$RUNNER_TEMP/remote3" "$RUNNER_TEMP/agenthome/.nanobot/workspace"
          # An agent set up before "Free models only": the service keeps it to free models once.
          echo '{"providers": {"openrouter": {"apiKey": "${OPENROUTER_API_KEY}"}}, "agents": {"defaults": {"modelPreset": "ultra"}}}'             > "$RUNNER_TEMP/agenthome/.nanobot/config.json"
          sudo env NANOBOREALIS_REMOTE_PORT=18868 NANOBOREALIS_REMOTE_UPSTREAM_PORT=18765 \
            NANOBOREALIS_REMOTE_STATE="$RUNNER_TEMP/remote3" NANOBOREALIS_REMOTE_TEST_SECRET=test-password \
            NANOBOREALIS_REMOTE_TEST_PIN_FILE="$RUNNER_TEMP/pin3" NANOBOREALIS_REMOTE_TEST_OWNER="$USER" \
            NANOBOREALIS_REMOTE_LOCAL_SOCKET="$RUNNER_TEMP/local3.sock" \
            NANOBOREALIS_REMOTE_TEST_AGENT_HOME="$RUNNER_TEMP/agenthome" \
            NANOBOREALIS_REMOTE_POOL_INFO="$RUNNER_TEMP/pool.json" \
            NANOBOREALIS_REMOTE_RELEASES_API=http://127.0.0.1:9/ \
            NANOBOREALIS_REMOTE_POOL_EVERY=1 NANOBOREALIS_REMOTE_POOL_API_FILE="$RUNNER_TEMP/pool-api" \
            NANOBOREALIS_REMOTE_POOL_PY="$PWD/system_files/usr/share/nanoborealis/pool.py" \
            NANOBOREALIS_POOL_API=http://127.0.0.1:18871 NANOBOREALIS_POOL_STATE="$RUNNER_TEMP/poolstate" \
            NANOBOREALIS_POOL_OFFLINE=1 \
            nohup python3 system_files/usr/libexec/nanoborealis-remote > "$RUNNER_TEMP/remote3.log" 2>&1 &
          for i in $(seq 1 30); do grep -q 'paired devices on port' "$RUNNER_TEMP/remote3.log" && break; sleep 1; done
          "$RUNNER_TEMP/venv/bin/python" client/dev/terminal_check.py 127.0.0.1:18868 "$RUNNER_TEMP/pin3" "$USER" \
            "$RUNNER_TEMP/local3.sock"
          # The kernel says who's asking, and root (like the agent's account) is turned away.
          sudo "$RUNNER_TEMP/venv/bin/python" -c 'import sys; sys.path.insert(0, "client/src"); import pairing
          try:
              pairing.pair_here(sys.argv[1])
          except pairing.PairingError as e:
              print(f"ok   root cannot pair the app over the local socket ({e})")
          else:
              sys.exit("FAIL root paired the app over the local socket")' "$RUNNER_TEMP/local3.sock"

      # The Pool page's pool.py talks to a stand-in exo that admin_check.py starts on this address.
      - name: The control center (the agent's models, channels, files, key; paired devices; the pool)
        env:
          NANOBOREALIS_POOL_API: http://127.0.0.1:18871
          NANOBOREALIS_REMOTE_POOL_API_FILE: ${{ runner.temp }}/pool-api
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/admin_check.py 127.0.0.1:18868 "$RUNNER_TEMP/pin3" "$RUNNER_TEMP/agenthome"'

      # Stand-ins for nvidia-smi, Podman and the node program; bundles from a local server.
      - name: Lending this device to the pool
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/poolnode_check.py'

      - name: Every screen uses only what the app has
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/ui_refs_check.py'

      - name: A reasoning model's thinking isn't shown as a chat title
        run: '"$RUNNER_TEMP/venv/bin/python" client/dev/chat_title_check.py'

      - name: The UI module loads
        working-directory: client/src
        run: '"$RUNNER_TEMP/venv/bin/python" -c "import main; print(\"ok\")"'

      - name: Gateway and remote-access logs
        if: always()
        run: |
          tail -n 80 "$RUNNER_TEMP/gateway.log" || true
          tail -n 20 "$RUNNER_TEMP/stub.log" || true
          tail -n 40 "$RUNNER_TEMP/remote.log" "$RUNNER_TEMP/remote2.log" "$RUNNER_TEMP/remote3.log" || true
